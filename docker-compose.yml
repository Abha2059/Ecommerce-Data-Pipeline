services:
  # =====================================================================
  # 1. MySQL 8.0 Relational Data Warehouse
  # =====================================================================
  mysql:
    image: mysql:8.0
    container_name: ecommerce_mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-rootpassword}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-ecommerce_dw}
      MYSQL_USER: ${MYSQL_USER:-airflow}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-airflow}
    ports:
      - "${MYSQL_CONTAINER_HOST_PORT:-3307}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./sql/schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD:-rootpassword}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # =====================================================================
  # 2. Airflow DB Migration & Admin User Initialization
  # =====================================================================
  airflow-init:
    build: .
    container_name: ecommerce_airflow_init
    entrypoint: /bin/bash
    command:
      - -c
      - |
        airflow db migrate &&
        airflow users create \
          --username admin \
          --firstname Data \
          --lastname Engineer \
          --role Admin \
          --email admin@example.com \
          --password admin
    environment:
      AIRFLOW__CORE__LOAD_EXAMPLES: "False"
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: mysql+mysqlconnector://${MYSQL_USER:-airflow}:${MYSQL_PASSWORD:-airflow}@mysql:3306/${MYSQL_DATABASE:-ecommerce_dw}
    depends_on:
      mysql:
        condition: service_healthy

  # =====================================================================
  # 3. Airflow Webserver (UI on http://localhost:8085)
  # =====================================================================
  airflow-webserver:
    build: .
    container_name: ecommerce_airflow_webserver
    restart: unless-stopped
    command: airflow webserver
    ports:
      - "${AIRFLOW_PORT:-8085}:8080"
    environment:
      AIRFLOW__CORE__LOAD_EXAMPLES: "False"
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: mysql+mysqlconnector://${MYSQL_USER:-airflow}:${MYSQL_PASSWORD:-airflow}@mysql:3306/${MYSQL_DATABASE:-ecommerce_dw}
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      MYSQL_DATABASE: ${MYSQL_DATABASE:-ecommerce_dw}
      MYSQL_USER: ${MYSQL_USER:-airflow}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-airflow}
    volumes:
      - ./dags:/opt/airflow/dags
      - ./data:/opt/airflow/data
      - ./src:/opt/airflow/src
      - ./config:/opt/airflow/config
      - ./sql:/opt/airflow/sql
      - ./run_historical_pipeline.py:/opt/airflow/run_historical_pipeline.py
    depends_on:
      airflow-init:
        condition: service_completed_successfully
      mysql:
        condition: service_healthy

  # =====================================================================
  # 4. Airflow Scheduler
  # =====================================================================
  airflow-scheduler:
    build: .
    container_name: ecommerce_airflow_scheduler
    restart: unless-stopped
    command: airflow scheduler
    environment:
      AIRFLOW__CORE__LOAD_EXAMPLES: "False"
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: mysql+mysqlconnector://${MYSQL_USER:-airflow}:${MYSQL_PASSWORD:-airflow}@mysql:3306/${MYSQL_DATABASE:-ecommerce_dw}
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      MYSQL_DATABASE: ${MYSQL_DATABASE:-ecommerce_dw}
      MYSQL_USER: ${MYSQL_USER:-airflow}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-airflow}
    volumes:
      - ./dags:/opt/airflow/dags
      - ./data:/opt/airflow/data
      - ./src:/opt/airflow/src
      - ./config:/opt/airflow/config
      - ./sql:/opt/airflow/sql
      - ./run_historical_pipeline.py:/opt/airflow/run_historical_pipeline.py
    depends_on:
      airflow-init:
        condition: service_completed_successfully
      mysql:
        condition: service_healthy

volumes:
  mysql_data:
